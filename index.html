<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JUNE | Portrait Portfolio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1A1A1A;
    }

    .container {
      width: 100%;
      padding: 0 20px 80px 20px;
    }

    .hero {
      position: relative; 
      width: 100%;
      display: inline-block;
      overflow: visible;
      margin: 0;
      padding-bottom: 80px;
    }

    .scroll-down {
    /* float */
      position: absolute;                
      display: flex;

      /* center */
      left: 50%;
      transform: translateX(-50%);
      bottom: 20px;

      /* alignment */
      flex-direction: column ; 
      align-items: center !important;    
      
      /* position accent */
      z-index: 10 !important;   
      padding-bottom: 80px;      

      /* animation */
      animation: moveDown 1.8s ease-out infinite;
}

    /* between scroll-down imgs */
    .scroll-down img {
      display: block;
      margin: 4px 0;
}

/* repeat animation */
@keyframes moveDown {
  0% {
    transform: translate(-50%, -10px); 
    opacity: 0.3;                
  }
  50% {
    transform: translate(-50%, 0);
    opacity: 1;
  }
  100% {
    transform: translate(-50%, 10px);  
    opacity: 1;                 
  }
}

    .section {
      margin-bottom: 45px;
      padding: 80px 20%; 
    }

    .section-title {
      display: block;
      height: 24px; 
      width: auto;
      margin-bottom: 16px;
    }

    .info-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 4px;
    }

    /* container Horizontal */
    .gallery-column {
      display: flex;
      flex-direction: column; 
      gap: 16px;              
      width: 100%;
    }

    /* image container */
    .img-box {
      width: 100%;
      overflow-x: auto;      
      overflow-y: hidden;
      white-space: nowrap;

      /* right fade-out */
      -webkit-mask-image: linear-gradient(to right, black 75%, transparent 100%);
      mask-image: linear-gradient(to right, black 75%, transparent 100%);

      /* hide scrollbar */
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .img-box::-webkit-scrollbar {
      display: none;
    }

    .img-box img {
      display: inline-block;
      height: 300px;           
      width: auto;            
      max-width: none;        
      border-radius: 2px;
    }

    /* specific image */
    .img-box img.tall-img {
      height: 460px !important;
    }

    .site-footer {
      width: 100%;
      display: flex;
      justify-content: center; 
      padding: 80px 20%;
    }

    .footer-container {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 24px; 
      width: 100%;
    }

    .video-slider-wrapper {
      width: auto; 
      height: 320px; 
      position: relative;
      flex-shrink: 0; 
      overflow: hidden;
    }

    .video-slider {
      width: 100%;
      height: 100%;
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory; 
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      -ms-overflow-style: none;
      cursor: grab;
    }

    .video-slider::-webkit-scrollbar {
      display: none;
    }

    .video-card {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      position: relative;
    }

    .video-card video {
      width: 100%;
      height: 100%;
      object-fit: cover; 
    }

    .footer-info-box {
      flex: 1;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .info-image-area img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    /* Interactive Screen */
    @media (max-width: 768px) {
      .footer-container {
        flex-direction: column;
      }
      .video-slider-wrapper {
        width: 100%;
      }
      .footer-info-box {
        width: auto;
        height: auto;
      }
    }
    .padding {
      padding-top: 80px;
      padding-bottom: 100px;
    }

  </style>
</head>
<body>

  <main class="container">

    <section class="hero">
      <img src="cover1.png" width="100%">

    <div class="scroll-down">
      <img src="Scroll down for pics.png" style="height: 18px;" alt="Scroll down">
      <img src="down.png" style="height: 20px;">
    </div>
    </section>

    <section class="section">
      <img src="Information.png" class="section-title">
      <img src="info.png" class="info-img">
    </section>

    <section class="section">
      <img src="Selfie.png" class="section-title">
      <div class="gallery-column">
        <div class="img-box"><img src="selfie-1.png"></div>
        <div class="img-box"><img src="selfie-2.png"></div>
      </div>
    </section>

    <section class="section">
      <img src="Half; Bust.png" class="section-title" alt="Half Bust">
      <div class="gallery-column">
        <div class="img-box"><img src="half-1.png"></div>
        <div class="img-box"><img src="half-2.png" class="tall-img"></div>
      </div>
    </section>

    <section class="section">
      <img src="Full.png" class="section-title">
      <div class="gallery-column">
        <div class="img-box"><img src="full-1.png"></div>
        <div class="img-box"><img src="full-2.png"></div>
        <div class="img-box"> <img src="full-3.png" class="tall-img"></div>
      </div>
    </section>

    <section class="section">
      <img src="Snaps.png" class="section-title">
      <div class="gallery-column">
        <div class="img-box"><img src="snap-1.png"></div>
        <div class="img-box"><img src="snap-2.png" class="tall-img"></div>
      </div>
    </section>

    <footer class="site-footer">
      <div class="footer-container">
        
        <div class="video-slider-wrapper">
          <div class="video-slider">
            <div class="video-card">
              <video autoplay muted loop playsinline>
                <source src="Vid-4.mp4" type="video/mp4">
              </video>
            </div>

            <div class="video-card">
              <video autoplay muted loop playsinline>
                <source src="Vid-1.mp4" type="video/mp4">
              </video>
            </div>
          </div>
        </div>

        <div class="footer-info-box">
          <div class="info-image-area">
            <img src="FOOTER.png" alt="Footer Info">
          </div>
        </div>

      </div>
    </footer>

  </main>

</body>
</html>
